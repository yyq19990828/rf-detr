stages:
  - sync

variables:
  GITHUB_MIRROR_URL: "https://github.com/yyq19990828/rf-detr.git"
  GITLAB_MIRROR_URL: "http://yangyiqing:${GITLAB_PAT}@192.168.2.10:82/perception/2d_triain/rf-detr.git"

sync-from-github:
  stage: sync
  tags:
    - docker
  image:
    name: alpine/git:latest
    entrypoint: [""]
  only:
    - schedules
  script:
    - git clone --bare "${GITHUB_MIRROR_URL}" /tmp/rf-detr-mirror
    - cd /tmp/rf-detr-mirror
    - echo "GitHub yyq_develop HEAD: $(git rev-parse yyq_develop)"
    - echo "GitLab yyq_develop HEAD before push: $(git ls-remote "${GITLAB_MIRROR_URL}" yyq_develop | awk '{print $1}')"
    - git push "${GITLAB_MIRROR_URL}" --all --force
    - git push "${GITLAB_MIRROR_URL}" --tags --force
